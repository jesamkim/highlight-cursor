<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1f2e"/>
      <stop offset="100%" stop-color="#0b0e17"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="360" fill="url(#bg)" rx="16"/>

  <!-- 패널 1: 커서 하이라이트 (은은한 펄스 링, #FFCC00 계열) -->
  <g transform="translate(150,180)">
    <circle r="46" fill="none" stroke="#FFCC00" stroke-width="3" opacity="0.9" filter="url(#glow)"/>
    <circle r="46" fill="none" stroke="#FFCC00" stroke-width="3" opacity="0.35"/>
    <path d="M-6 -18 L-6 18 L1 9 L8 24 L14 21 L7 6 L18 6 Z" fill="#FFFFFF" stroke="#0b0e17" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" fill="#B8BFCC" font-family="-apple-system,Helvetica,Arial" font-size="18">하이라이트</text>
  </g>

  <!-- 패널 2: 클릭 이펙트 - 물결(ripple), 좌클릭 청록/우클릭 주황 -->
  <g transform="translate(450,180)">
    <circle r="60" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.15" filter="url(#glow)"/>
    <circle r="40" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.55" filter="url(#glow)"/>
    <circle r="22" fill="none" stroke="#22D3EE" stroke-width="4" opacity="0.9" filter="url(#glow)"/>
    <path d="M-6 -14 L-6 14 L1 7 L8 19 L13 16 L6 4 L15 4 Z" fill="#FFFFFF" stroke="#0b0e17" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" fill="#B8BFCC" font-family="-apple-system,Helvetica,Arial" font-size="18">클릭 이펙트 (물결)</text>
  </g>

  <!-- 패널 3: 스포트라이트 - 주변 어둡게, 중앙만 밝게 -->
  <g transform="translate(750,180)">
    <rect x="-90" y="-90" width="180" height="180" fill="#000000" opacity="0.55" rx="10"/>
    <circle r="55" fill="#0b0e17" opacity="0.0"/>
    <circle r="55" fill="none" stroke="#FFCC00" stroke-width="0" opacity="0"/>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <circle r="55" fill="url(#spot)"/>
    <circle r="46" fill="none" stroke="#FFCC00" stroke-width="3" opacity="0.7"/>
    <path d="M-6 -18 L-6 18 L1 9 L8 24 L14 21 L7 6 L18 6 Z" fill="#FFFFFF" stroke="#0b0e17" stroke-width="2"/>
    <text x="0" y="90" text-anchor="middle" fill="#B8BFCC" font-family="-apple-system,Helvetica,Arial" font-size="18">스포트라이트</text>
  </g>
</svg>
