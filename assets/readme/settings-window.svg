<?xml version="1.0" encoding="UTF-8"?>
<svg width="440" height="640" viewBox="0 0 440 640" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Helvetica,Arial">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="spotbg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#0d0f16"/>
    </radialGradient>
  </defs>

  <!-- 창 배경 (macOS 타이틀바 포함) -->
  <rect width="440" height="640" fill="#2b2b30" rx="10"/>
  <rect width="440" height="36" fill="#3a3a3f" rx="10"/>
  <rect y="26" width="440" height="10" fill="#3a3a3f"/>
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#febc2e"/>
  <circle cx="60" cy="18" r="6" fill="#28c840"/>
  <text x="220" y="23" text-anchor="middle" fill="#c9c9cc" font-size="13">Highlight Cursor 설정</text>

  <!-- 본문 -->
  <g transform="translate(20,50)">
    <!-- 미리보기 섹션 -->
    <text x="0" y="14" fill="#e8e8ea" font-size="13" font-weight="bold">미리보기</text>
    <rect x="0" y="24" width="360" height="140" rx="8" fill="url(#spotbg)"/>
    <!-- 스포트라이트 -->
    <rect x="0" y="24" width="360" height="140" rx="8" fill="#000000" opacity="0.35"/>
    <circle cx="180" cy="94" r="55" fill="#ffffff" opacity="0.06"/>
    <!-- 하이라이트 링 -->
    <circle cx="180" cy="94" r="26" fill="none" stroke="#FFCC00" stroke-width="3" filter="url(#glow)"/>
    <path d="M174 82 L174 106 L179 100 L184 111 L188 109 L183 98 L191 98 Z" fill="#FFFFFF" stroke="#141824" stroke-width="1.5"/>

    <!-- 하이라이트 섹션 -->
    <text x="0" y="192" fill="#e8e8ea" font-size="13" font-weight="bold">하이라이트</text>
    <!-- 지름 슬라이더 -->
    <text x="0" y="216" fill="#c9c9cc" font-size="12">지름</text>
    <rect x="70" y="209" width="200" height="4" rx="2" fill="#55555c"/>
    <circle cx="145" cy="211" r="8" fill="#e8e8ea"/>
    <text x="280" y="215" fill="#c9c9cc" font-size="12">50px</text>
    <!-- 투명도 슬라이더 -->
    <text x="0" y="244" fill="#c9c9cc" font-size="12">투명도</text>
    <rect x="70" y="237" width="200" height="4" rx="2" fill="#55555c"/>
    <circle cx="150" cy="239" r="8" fill="#e8e8ea"/>
    <text x="280" y="243" fill="#c9c9cc" font-size="12">30%</text>
    <!-- 색상 -->
    <text x="0" y="272" fill="#c9c9cc" font-size="12">색상</text>
    <rect x="70" y="261" width="34" height="20" rx="4" fill="#FFCC00" stroke="#7a7a80"/>

    <!-- 스포트라이트 섹션 -->
    <text x="0" y="306" fill="#e8e8ea" font-size="13" font-weight="bold">스포트라이트</text>
    <text x="0" y="330" fill="#c9c9cc" font-size="12">반경</text>
    <rect x="70" y="323" width="200" height="4" rx="2" fill="#55555c"/>
    <circle cx="130" cy="325" r="8" fill="#e8e8ea"/>
    <text x="280" y="329" fill="#c9c9cc" font-size="12">150px</text>
    <text x="0" y="358" fill="#c9c9cc" font-size="12">어둡기</text>
    <rect x="70" y="351" width="200" height="4" rx="2" fill="#55555c"/>
    <circle cx="150" cy="353" r="8" fill="#e8e8ea"/>
    <text x="280" y="357" fill="#c9c9cc" font-size="12">50%</text>

    <!-- 트레일 섹션 -->
    <text x="0" y="392" fill="#e8e8ea" font-size="13" font-weight="bold">트레일</text>
    <text x="0" y="416" fill="#c9c9cc" font-size="12">잔상 개수</text>
    <rect x="90" y="409" width="180" height="4" rx="2" fill="#55555c"/>
    <circle cx="150" cy="411" r="8" fill="#e8e8ea"/>
    <text x="280" y="415" fill="#c9c9cc" font-size="12">8개</text>

    <!-- 시작 섹션 -->
    <text x="0" y="450" fill="#e8e8ea" font-size="13" font-weight="bold">시작</text>
    <rect x="0" y="460" width="16" height="16" rx="3" fill="none" stroke="#8a8a90" stroke-width="1.5"/>
    <text x="24" y="472" fill="#c9c9cc" font-size="12">macOS 로그인 시 자동 실행</text>
  </g>
</svg>
